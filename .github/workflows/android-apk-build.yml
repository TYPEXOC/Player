name: Android APK build

on:
  push:
    branches: [android-apk-build]
  workflow_dispatch:
    inputs:
      all_abis:
        description: 'Build toolchains for all 4 ABIs instead of arm64-v8a only (much slower)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      # buildscripts only compiles liblcf when this is set
      BUILD_LIBLCF: 1

    steps:
      - name: Check out Player
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            ninja-build meson autoconf automake libtool pkg-config nasm

      - name: Get EasyRPG buildscripts
        run: |
          git clone --depth 1 https://github.com/EasyRPG/buildscripts.git "$GITHUB_WORKSPACE/../buildscripts"
          cd "$GITHUB_WORKSPACE/../buildscripts/android"
          echo "TOOLCHAIN_ROOT=$(pwd)" >> "$GITHUB_ENV"

      - name: Download libraries and Android SDK/NDK
        working-directory: ${{ env.TOOLCHAIN_ROOT }}
        run: ./1_download_library.sh

      - name: Build dependency toolchains
        working-directory: ${{ env.TOOLCHAIN_ROOT }}
        run: |
          if [ "${{ inputs.all_abis }}" != "true" ]; then
            # Keep only the arm64-v8a toolchain: the debug APK defaults to
            # arm64-v8a, so this cuts the build time to roughly a quarter.
            # Remove this sed (or pass all_abis=true) to build every ABI.
            sed -i 's/^build "ARMeabi-v7a"/#&/; s/^build "x86"/#&/; s/^build "x86_64"/#&/' 2_build_toolchain.sh
          fi
          ./2_build_toolchain.sh

      - name: Build debug APK
        run: |
          cd builds/android
          ./gradlew -PtoolchainDirs="${{ env.TOOLCHAIN_ROOT }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easyrpg-player-android-debug
          path: builds/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
