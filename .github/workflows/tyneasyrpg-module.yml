name: Tyneasyrpg module build

on:
  push:
    branches: [tyn-module]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Android APK (arm64-v8a + armeabi-v7a debug)
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      # buildscripts only compiles liblcf when this is set
      BUILD_LIBLCF: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            ninja-build meson autoconf automake libtool pkg-config nasm

      - name: Get EasyRPG buildscripts
        run: |
          git clone --depth 1 https://github.com/EasyRPG/buildscripts.git "$GITHUB_WORKSPACE/../buildscripts"
          cd "$GITHUB_WORKSPACE/../buildscripts/android"
          echo "TOOLCHAIN_ROOT=$(pwd)" >> "$GITHUB_ENV"

      - name: Download libraries and Android SDK/NDK
        working-directory: ${{ env.TOOLCHAIN_ROOT }}
        run: |
          bash ./1_download_library.sh
          chmod -R u+x "$PWD/android-sdk/cmdline-tools" || true

      - name: Build arm64-v8a + armeabi-v7a dependency toolchains
        working-directory: ${{ env.TOOLCHAIN_ROOT }}
        run: |
          # The module packages arm64-v8a and armeabi-v7a; skip the two x86
          # ABIs (emulator-only targets) to save toolchain time.
          sed -i 's/^build "x86"/#&/; s/^build "x86_64"/#&/' 2_build_toolchain.sh
          bash -x ./2_build_toolchain.sh

      - name: Build module APK
        run: |
          cd builds/tyneasyrpg
          bash gradlew assembleDebug \
            -PtoolchainDirs="${{ env.TOOLCHAIN_ROOT }}" 2>&1 | tee gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # Dump the failure tail into the step summary (public, no sign-in).
            {
              echo "### Gradle failure (last 150 lines)"
              echo '```'
              tail -150 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -aE "error:|FAILURE:|CMake Error|e: |Exception" gradle-build.log | head -30 | while IFS= read -r l; do
              echo "::error::${l:0:400}"
            done
            exit $rc
          fi

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: tyneasyrpg-debug-arm64-v8a
          path: builds/tyneasyrpg/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: tyneasyrpg-debug-armeabi-v7a
          path: builds/tyneasyrpg/app/build/outputs/apk/armv7/debug/*.apk
          if-no-files-found: error
          retention-days: 14
