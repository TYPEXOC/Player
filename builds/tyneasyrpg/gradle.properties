org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false

# Path to the EasyRPG Player source tree (contains the root CMakeLists.txt).
# Override with -PplayerSrc=... or ORG_GRADLE_PROJECT_playerSrc.
playerSrc=../../..

# Path to the "android" directory style toolchain root built with EasyRPG
# buildscripts; passed through as PLAYER_ANDROID_TOOLCHAIN_PATH.
# Override with -PtoolchainDirs=... or ORG_GRADLE_PROJECT_toolchainDirs.
#toolchainDirs=

